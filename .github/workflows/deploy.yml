name: Deploy React to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Generate index.html and Prepare Output
        run: |
          echo "Préparation du dossier de déploiement..."
          mkdir -p deploy_folder
          
          # On copie les assets générés
          if [ -d ".output/public" ]; then
            cp -r .output/public/* deploy_folder/
          fi
          
          echo "Démarrage du serveur local pour capturer l'application..."
          PORT=3000 node .output/server/index.mjs &
          SERVER_PID=$!
          
          echo "Attente de 5 secondes pour que le serveur démarre..."
          sleep 5
          
          echo "Capture de la page d'accueil vers index.html..."
          curl -s http://localhost:3000 > deploy_folder/index.html
          
          echo "Arrêt du serveur local..."
          kill $SERVER_PID
          
          echo "=== Contenu final du dossier de déploiement ==="
          ls -la deploy_folder

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './deploy_folder'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

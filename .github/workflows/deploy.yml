name: Deploy React to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Locate and Prepare Output
        run: |
          echo "Recherche du dossier de compilation..."
          if [ -d ".output/public" ]; then
            echo "Dossier .output/public trouvé (TanStack/Nitro) !"
            mv .output/public deploy_folder
          elif [ -d "dist" ]; then
            echo "Dossier dist trouvé !"
            mv dist deploy_folder
          elif [ -d "build" ]; then
            echo "Dossier build trouvé !"
            mv build deploy_folder
          else
            echo "Erreur : Aucun dossier de build standard n'a été trouvé."
            echo "Voici le contenu du répertoire pour nous aider à débugger :"
            ls -la
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './deploy_folder'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

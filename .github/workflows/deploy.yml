name: Deploy React to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Locate and Prepare Output
        run: |
          echo "=== Contenu complet du workspace après le build ==="
          find . -maxdepth 3 -not -path '*/.*' -not -path './node_modules*'
          
          echo "=== Recherche ciblée des fichiers index.html ==="
          find . -name "index.html" -not -path './node_modules*'
          
          # On crée un dossier de déploiement propre
          mkdir -p deploy_folder
          
          # S'il y a un dossier .output/public, on le prend
          if [ -d ".output/public" ]; then
            cp -r .output/public/* deploy_folder/
          elif [ -d "dist" ]; then
            cp -r dist/* deploy_folder/
          elif [ -d "build" ]; then
            cp -r build/* deploy_folder/
          fi
          
          echo "=== Contenu final du dossier de déploiement ==="
          ls -la deploy_folder

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './deploy_folder'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

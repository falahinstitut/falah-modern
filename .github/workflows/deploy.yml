name: Deploy React to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Locate and Prepare Output
        run: |
          echo "=== Contenu après le build ==="
          ls -la .output || ls -la dist || ls -la build
          
          mkdir -p deploy_folder
          
          # Avec le preset static, Nitro place les fichiers ici :
          if [ -d ".output/public" ]; then
            cp -r .output/public/* deploy_folder/
          elif [ -d ".output" ]; then
            cp -r .output/* deploy_folder/
          elif [ -d "dist" ]; then
            cp -r dist/* deploy_folder/
          fi
          
          echo "=== Vérification de la présence de index.html ==="
          ls -la deploy_folder

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './deploy_folder'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
